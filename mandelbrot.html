<html>
<head>
<script>
// TODO: Colorize
'use strict';
window.onload = function() {
    var crrlib = crr.crrlib();
    var math = crr.math

    var formula = math.compile('z=z^2+c');
    var num_color = 50;
    var max_count = 200;
    var div = max_count / num_color;
    var colors = crrlib.make_helper('colors', { type: 'facingwb' })(num_color);

    crrlib.init('#crr-container', {
        extent: { l: -3, b: -2, t: 2, r: 1 },
        cell: function(c) {
            var z = 0;
            var k = 0;
            for(; k < max_count; ++k) {
                z = formula.evaluate({z: z, c: c });
                if(math.abs(z) > 2) break;
            }
            return { fill: (k == max_count ? '#000000' : colors[math.floor(k/div)]) };
        }
    });
    crrlib.run();

}
</script>
</head>
<body>
<div id="crr-container"></div>
</body>
</html>
