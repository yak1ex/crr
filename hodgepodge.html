<html>
<head>
<script>
// TODO: torus on/off
// TODO: adj 4/8
// TODO: colors
// TODO: size
'use strict';
var k1 = 2, k2 = 3, g = 2;
var stop, run, restart;
window.onload = function() {
    var crrlib = crr.crrlib();
    var math = crr.math

    var idx1 = crrlib.make_helper('idx1'), adj = crrlib.make_helper('adj4', { torus: true });
    var table_old = [], table_new = [];
    var colors;
    crrlib.init('#crr-container', {
        type: 'integer',
        extent: { l: 0, b: 0, t: 100, r: 100 },
        size: { x: 100, y: 100 },
        cell: function(z) {
            return { fill: colors[table_new[idx1(z)]] }
        },
        leave: function(dat) {
            var temp = table_old; table_old = table_new; table_new = temp;
            var N = colors.length - 1;
            for(var j = 0; j < 100; ++j) {
                for(var i = 0; i < 100; ++i) {
                    var cur = idx1(i,j);
                    var adjs = adj(i,j);
                    var a = 1, b = 0, s = table_old[cur];
                    for(var k = 0; k < adjs.length; ++k) {
                        var idx = adjs[k];
                        if(table_old[idx] < N) ++a;
                        if(table_old[idx] === N) ++b;
                        s += table_old[idx];
                    }
                    if(table_old[cur] === 0) { table_new[cur] = Math.floor(a/k1) + Math.floor(b/k2); }
                    else if(table_old[cur] === N) { table_new[cur] = 0; }
                    else { table_new[cur] = Math.floor(s/a) + g; }
                    if(table_new[cur] > N) table_new[cur] = N;
                }
            }
            document.querySelector('#counter').innerText = dat.counter;
        },
        interval: 100,
    });
    function init() {
        g = Math.floor(Math.random() * 19 + 1);
        document.querySelector('#g').innerText = g;
        colors = crrlib.make_helper('colors', { type: 'hsllinear', from: [0,0,1], to: [0,1,0.5] })(Math.floor(Math.random() * 5 + 15));
        document.querySelector('#colors').innerText = colors.length;
        for(var j = 0; j < 100; ++j) {
            for(var i = 0; i < 100; ++i) {
                table_new[idx1(i,j)] = Math.floor(Math.random() * colors.length);
            }
        }
    };
    init();
    stop = crrlib.stop;
    run = crrlib.run;
    restart = function() { crrlib.restart(init); };

    crrlib.run();

}
</script>
</head>
<body>
<div id="crr-container"></div>
<div><p id="colors"></p></div>
<div><p id="g"></p></div>
<div><p id="counter"></p></div>
<input type="button" value="stop" onclick="stop()">
<input type="button" value="run" onclick="run()">
<input type="button" value="restart" onclick="restart()">
</body>
</html>
